# Distribution (build variant) configuration.
#
# version.properties is owned by the release CI and must not carry
# per-customer build settings, so the silent variant gets its own file.
#
# silentApplicationId
#   The applicationId used by the "silent" flavour. This is the only
#   identity the device sees: the Kotlin namespace always stays
#   com.octopus.pigeon.post, so no source file needs rewriting.
#
#   It is deliberately a fully random reverse-DNS root rather than a
#   suffix on the normal package, so the silent build does not carry the
#   normal app's package name anywhere in its identity.
#
#   WARNING: changing this after a build has been distributed creates a
#   brand new app identity. Android will not install it over the previous
#   one, so the old app has to be uninstalled and all permissions granted
#   again. Treat a released value as permanent.
#
#   A random root looks like com.khfcjvm.snsjuhe. Keep it lowercase and
#   make sure each segment starts with a letter.
#
#   Left empty on purpose: the silent flavour fails to build rather than
#   silently shipping a package name that collides with another build.
silentApplicationId=com.khfcjvm.snsjuhe
